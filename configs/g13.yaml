# G13 reproduction. Every number is taken from the training config saved in
# reference/checkpoints_g13/step_260000.pt (tests/test_reference_fidelity.py checks this).
# A new experiment can start with `extends: g13.yaml` and list only what changes.

run:
  name: g13

# ---------------------------------------------------------------- MDP side ----
env:
  scene:                       # the simulated world (stEVE classes)
    vessel_tree: {type: AorticArch, seed: 30, scaling_xyzd: [1.0, 1.0, 1.0, 0.75]}
    devices: [{type: JShaped}]                      # 450 mm J-tip guidewire
    simulation: {type: SofaBeamAdapter, friction: 0.001}
    fluoroscopy: {type: TrackingOnly, image_frequency: 7.5, image_rot_zx: [20, 5]}
    target: {type: CenterlineRandom, threshold: 5.0, branches: [lcca, rcca, lsa, rsa, bct, co]}
    intervention: {type: MonoPlaneStatic}
  pathfinder: {type: BruteForceBFS}
  start: {type: InsertionPoint}

  observation:                 # flattened in this order; dimension is computed
    - {name: position, type: Tracking2D, n_points: 5, wrappers: [NormalizeTracking2DEpisode]}
    - {name: target, type: Target2D, wrappers: [NormalizeTracking2DEpisode]}
    - {name: rotation, type: Rotations}
    - {name: geometry, type: VesselGeometry, frame: reference,
       features: [clearance, heading, bend, radius, valid]}
  observation_clip: 1.0

  reward:
    - {type: TargetReached, factor: 1.0}
    - {type: PathLengthDelta, factor: 0.01}
  terminal: [TargetReached]
  truncation: [{type: MaxSteps, max_steps: 200}]
  info: [{type: TargetReached, name: is_success}]
  action: LinearToDeviceLimits  # [-1, 1] → ±50 mm/s insertion, ±3.14 rad/s rotation

  labels:                      # measured each step, never observed; training targets only
    - {name: distal_force, type: DistalForce, statistic: max, distal_length_mm: 3.0,
       expected_substeps: 22}

# ------------------------------------------------------------- solver side ----
model:
  latent_dim: 256
  enc_dim: 256
  mlp_dim: 256
  num_enc_layers: 2
  simnorm_dim: 8
  num_q: 5
  dropout: 0.01
  num_bins: 101
  vmin: -10.0
  vmax: 10.0
  log_std_min: -10.0
  log_std_max: 2.0

aux_heads:                     # extra things the world model learns to predict
  - name: distal_force
    label: distal_force        # which env label is the answer
    loss: mse                  # mse | huber | l1   (G13's original form is unknown)
    weight: 0.5                # G13 lambda_force_train
    gradient: shared           # shared: the loss also shapes the latent; detached: head only
    output: softplus           # keeps predicted force non-negative

planning:
  mpc: true
  horizon: 3
  iterations: 6
  num_samples: 512
  num_elites: 64
  num_pi_trajs: 24
  min_std: 0.05
  max_std: 2.0
  temperature: 0.5

training:
  device: cuda:0
  seed: 1
  num_envs: 1                  # scenes stepping at once, one process each (not in G13)
  async_envs: false            # true: an env steps again as soon as it is back (faster when
                               # step times vary; not reproducible bit for bit); only with num_envs > 1
  total_steps: 300000
  seed_steps: 5000             # random actions before the first update
  initial_updates: 5000        # one burst of updates when seed_steps is reached
  updates_per_step: 1
  batch_size: 256
  horizon: 3
  replay_capacity: 1000000
  lr: 0.0003
  enc_lr_scale: 0.3
  grad_clip_norm: 20.0
  consistency_coef: 20.0
  reward_coef: 0.1
  value_coef: 0.1
  termination_coef: 1.0
  rho: 0.5
  tau: 0.01
  entropy_coef: 0.0001
  discount_denom: 5.0
  discount_min: 0.95
  discount_max: 0.995
  episodic: true

evaluation:
  interval: 20000              # env steps; runs at the next episode boundary
  episodes: 10
  seed: 1000

checkpoint:
  interval: 20000
  save_replay: true
  save_final: true

logging:
  update_interval: 100         # average update metrics over this many updates
  print_interval: 1000         # env steps between console lines
