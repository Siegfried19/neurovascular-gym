# conda env guidewire_rl: Python 3.12 + SofaPython3 from SOFA 25.12 + this repository.
#   conda env create -f environment.yml
# Still to do afterwards: install stEVE (editable), install this repository (editable), set SOFA's environment
# variables, build BeamAdapter -- the steps are in README.md.
# Versions are the ones in use on 2026-11-10; torch is the CUDA 12.8 wheel. Without an NVIDIA GPU, drop the
# extra-index-url line to get the CPU build.
name: guidewire_rl
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.7.1
      - numpy==2.5.4
      - scipy==1.18.1
      - gymnasium==1.4.0
      - pyyaml==6.0.3
      - trimesh==5.2.0
      - pyvista==0.49.1
      - scikit-image==0.26.0
      - matplotlib==3.11.2
      - viser==1.1.1
      - pytest==9.1.1
